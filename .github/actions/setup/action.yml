name: Setup
description: pnpm, Node, and this package's dependencies.

runs:
  using: composite
  steps:
    # Before setup-node: its pnpm cache lookup shells out to pnpm to find the
    # store path. Version comes from packageManager in package.json.
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        # The current Active LTS, whichever that is: 24 today, 26 from
        # 2026-10-28, without a commit to move it. This is above the floor the
        # package declares (`engines.node`, 22) and above the Harness image's
        # base (node:22), so CI no longer proves the code at its own minimum —
        # the floor is guarded by `engines` and by the Harness image build on
        # a Target, not here. Pin an explicit major again if that ever needs
        # proving in CI too.
        node-version: lts/*
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
