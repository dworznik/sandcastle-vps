name: Setup
description: pnpm, Node, and this package's dependencies.

runs:
  using: composite
  steps:
    # Before setup-node: its pnpm cache lookup shells out to pnpm to find the
    # store path. Version comes from packageManager in package.json.
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        # The Active LTS, and the same major the Harness runs on a Target
        # (docker/harness/Dockerfile) and the floor the package declares
        # (`engines.node` in package.json). The three move together, by hand:
        # a floating `lts/*` here or `node:lts` there would let CI and a Target
        # installed a month apart drift onto different majors. Next move is 26,
        # Active LTS from 2026-10-28.
        node-version: 24
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
