name: CI

on:
  # Every PR, not just those targeting main: a stacked PR is based on its
  # parent branch, and filtering on main would leave the whole stack untested
  # until the moment it lands.
  pull_request:
  push:
    branches: [main]

# A superseded push to a PR has nothing left to prove.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Before setup-node: its pnpm cache lookup shells out to pnpm to find
      # the store path. Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # The minimum this package declares it supports, and the base the
          # sandbox images are built from.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The full pass, including the type-aware rules the pre-commit hook
      # skips for speed — no-floating-promises above all, in a Hono handler
      # dispatching Inngest work.
      - run: pnpm lint:type-aware

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan is a commit range, so both ends have to be present.
          fetch-depth: 0

      # Pinned and checksum-verified rather than a third-party action: this is
      # a security path, and handing a token to someone else's action in it is
      # exactly the wrong trade. It also sidesteps the licence gitleaks-action
      # requires once a repo sits under an organization.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      # Diff-scoped, not full-history: history is verified clean, so rescanning
      # it on every run buys nothing and only gets slower.
      - name: Scan the pushed commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # A branch's first push has no "before" to diff against.
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          ./gitleaks git --no-banner --redact --log-opts="--no-merges $range" .

  commits:
    name: commit conventions
    # There is no PR title to lint on a push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The title, not the commits: this repo squash-merges, so the title is
      # what becomes the commit on main and a commit-msg hook never sees it.
      # The " (#N)" suffix GitHub appends is part of that commit, so it is
      # linted too — a title that fits in 100 characters can still produce a
      # header that does not, which has already happened once on main.
      - name: Lint the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s (#%s)\n' "$TITLE" "$NUMBER" | pnpm exec commitlint

  shell:
    name: shell
    # Deliberately no Node: this job installs nothing from npm, so it should
    # not pay for a dependency install it never uses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned and checksum-verified, same as the gitleaks job. shfmt's sum is
      # the one upstream publishes in sha256sums.txt; shellcheck ships no such
      # file, so its sum pins the artifact as downloaded.
      - name: Install shellcheck and shfmt
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          SHFMT_VERSION: 3.12.0
          SHFMT_SHA256: d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea
        run: |
          curl -sSfL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          rm shellcheck.tar.xz

          curl -sSfL -o shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  shfmt" | sha256sum -c -
          chmod +x shfmt

      # Discovery is shebang-based, not glob-based: three of the six scripts
      # here (init-project, sandcastle-run, sync-env) have no .sh extension.
      - name: Find the shell scripts
        run: |
          ./shfmt -f . | tee shell-scripts.txt
          test -s shell-scripts.txt

      # -x -P SCRIPTDIR so the `source "${here}/lib/…"` lines in the vps
      # commands resolve to the libraries they actually load.
      - name: shellcheck
        run: xargs -a shell-scripts.txt ./shellcheck -x -P SCRIPTDIR

      - name: shfmt
        run: xargs -a shell-scripts.txt ./shfmt -i 2 -ci -sr -d
