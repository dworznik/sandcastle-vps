name: CI

on:
  # Every PR, not just those targeting main: a stacked PR is based on its
  # parent branch, and filtering on main would leave the whole stack untested
  # until the moment it lands.
  pull_request:
  push:
    branches: [main]

# A superseded push to a PR has nothing left to prove.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Before setup-node: its pnpm cache lookup shells out to pnpm to find
      # the store path. Version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # The minimum this package declares it supports, and the base the
          # sandbox images are built from.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The full pass, including the type-aware rules the pre-commit hook
      # skips for speed — no-floating-promises above all, in a Hono handler
      # dispatching Inngest work.
      - run: pnpm lint:type-aware

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan is a commit range, so both ends have to be present.
          fetch-depth: 0

      # Pinned and checksum-verified rather than a third-party action: this is
      # a security path, and handing a token to someone else's action in it is
      # exactly the wrong trade. It also sidesteps the licence gitleaks-action
      # requires once a repo sits under an organization.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      # Diff-scoped, not full-history: history is verified clean, so rescanning
      # it on every run buys nothing and only gets slower.
      - name: Scan the pushed commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            # A branch's first push has no "before" to diff against.
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          ./gitleaks git --no-banner --redact --log-opts="--no-merges $range" .
