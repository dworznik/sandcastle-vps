# The Orchestrator, and nothing else. The Harness runs as a systemd user
# service on the host, where Docker and the Project checkouts natively live —
# see ADR 0003.
services:
  inngest:
    image: inngest/inngest:latest
    # Host networking, because the two halves have to meet on loopback: the
    # Harness binds 127.0.0.1, which a bridged container has no route to.
    network_mode: host
    command:
      - inngest
      - start
      # With host networking there is no port publishing left to constrain the
      # bind, so this flag is the only thing keeping the dashboard off the
      # public interface. Reach it with: ssh -L 8288:127.0.0.1:8288 <vps>
      - --host
      - 127.0.0.1
      - --port
      - "8288"
      - --sdk-url
      - http://127.0.0.1:${PORT:-3000}/api/inngest
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
    volumes:
      - inngest_data:/var/lib/inngest
    restart: unless-stopped

volumes:
  inngest_data:
