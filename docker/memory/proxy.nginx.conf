# The Memory UI's proxy (see proxy.Dockerfile for why it exists and what
# removes it). One job: forward everything to the worker with an Origin the
# worker accepts. Same port as the worker, so a Peer reaches the UI at the
# port the plugin is known by.
server {
    listen 37777;

    # Docker's embedded DNS, asked per request: a `proxy_pass` with a literal
    # host is resolved once at start, which refuses to start when the worker
    # is not up yet and keeps a stale address after the worker is recreated.
    resolver 127.0.0.11 valid=10s;
    set $worker http://memory:37777;

    location / {
        proxy_pass $worker;
        proxy_http_version 1.1;

        # The whole point. The worker's check accepts an Origin starting with
        # http://localhost: or http://127.0.0.1:, and nothing else; the viewer
        # uses relative URLs, so the browser sends the tunnel origin and the
        # worker refuses every write. This is the loopback value it allows.
        proxy_set_header Origin http://127.0.0.1:37777;
        proxy_set_header Host $host;

        # The viewer streams events; buffering would hold them back, and the
        # default read timeout would cut a quiet stream.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
