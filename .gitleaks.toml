# Extends the shipped ruleset rather than replacing it: the defaults already
# catch AWS keys and, via generic-api-key, a high-entropy value assigned to a
# secret-named variable such as INNGEST_SIGNING_KEY.
[extend]
useDefault = true

# Neither gitleaks nor its generic-api-key rule detects Anthropic tokens, which
# is the one credential this platform handles by design — `claude setup-token`
# output, and the Target's compose .env.
#
# The {80,} threshold is load-bearing. It fires on real token lengths while
# staying silent on the deliberately short token-shaped fixtures the tests
# need, so no allowlist entry is needed. Keep any new fixture under that, and
# do not buy the same silence with a file-level ignore: the files holding those
# fixtures are the single most likely place a real token would later land.
# CLAUDE.md § Secret scanning names which files those are.
[[rules]]
id = "anthropic-key"
description = "Anthropic API key or OAuth token"
regex = '''sk-ant-(?:api|oat|adm)\d{2}-[A-Za-z0-9_-]{80,}'''
keywords = ["sk-ant-"]
